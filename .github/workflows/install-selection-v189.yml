name: Install V18.9 manuscript and position study
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-selection-v189.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: lottery-data-and-research
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install on verified V18.8 files
        run: |
          python - <<'INSTALL'
          from pathlib import Path
          import base64, gzip, hashlib
          assets={'app.js': ('e5e837cde98a1d9a60f2cee0d2afed5b572e4f5661ba227e811011e18c9b5905', '83a356b7a5c488cbd80d283559f6f6f026a6cfee9d39128216b836c8d025b36b', ''), 'index.html': ('7f101b346376e845346250fcd87371f9d647224a5c2d6409aa04abe7c9e655a2', '7760d931359cfcd5f94de31b9dd1fc2eb2bd78d23141c2a06917476c7bb19cd1', ''), 'selection-archive.mjs': ('f806e515912161e455ccad6bd8bd775d839ded78829c1d427ab01ae15b3a170e', '2b93fc0fa397764f7f6e64f48c5769adc320ec1a9bff7da0476c79cf6534af9c', ''), 'selection-ui.js': ('c2e2493b8e2cb67b11cd23080e661fe3849261233842f5ddef87541bbcc8175c', '09e7d6d6435a0bab14f42c9dde69b00b271b85a06ba69c45ea29b09762055021', ''), 'selection.css': ('7f7a1e1ccb7ef526d894d892845e88f8f2c28e2682d8eb197c5de91ad5ee1b89', '068e84de1274898a5f0469ed76af7787c56e036413cae872b871accb8d925781', ''), 'selection.html': ('4c0abfc87b04f300ea682f6dfcc6ce6ea59935b1b173b6ccbe2624c07ff3afaf', 'e4e1e1b44fce565394773f825e358e3545594e1397a65bd841b74fb8403fdf40', ''), 'sw.js': ('60740d258e606ece8217171e2d00c237f3ae30987198accd00491db44309749a', '1b2109081d4378b4d9e4fb5b3b970664bbbb8985190ef5abd42efde2f9a5d798', ''), 'position-study.js': (None, 'e28a4902bc0fc2f205a171cdc8ca9e5bfb3a5348f5295190350eb30822931cfb', ''), 'test_position_study.mjs': (None, '248dc57c3f3283b0622dc737a104906595b20b2c3ba08fb093369102308b7586', '')}
          updates=[]
          for name,(old_sha,new_sha,compressed) in assets.items():
              p=Path(name)
              current=hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
              if current==new_sha:
                  continue
              if current!=old_sha:
                  raise ValueError('Site files changed since V18.8; stopped before writing '+name)
              content=gzip.decompress(base64.b64decode(compressed))
              if hashlib.sha256(content).hexdigest()!=new_sha:
                  raise ValueError('Checksum failed for '+name)
              updates.append((p,content))
          for p,content in updates:
              p.write_bytes(content)
          print('Installed V18.9:',len(updates),'changed files')
          INSTALL
      - name: Archive before cutoff, run comparisons and verify the workbench
        run: |
          node --check selection-ui.js
          node selection-archive.mjs
          node --test test_*.mjs
          python -m unittest -q test_v183_integration test_reconcile_official_v183
      - name: Publish the tested files and supplemental locks
        run: |
          git add app.js index.html selection-archive.mjs selection-ui.js selection.css selection.html sw.js position-study.js test_position_study.mjs selection-data.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'release: V18.9 manuscript cases, paired position trial and four anchors'
            git push origin HEAD:main
          fi
      - name: Request build of the existing GitHub Pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
