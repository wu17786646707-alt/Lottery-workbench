name: Install formal researcher workflow V18.18
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/install-column-research-v1818.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: lottery-data-and-research
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pages.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install three-stage researcher picks
        run: |
          python - <<'INSTALL'
          from pathlib import Path
          import base64, gzip, hashlib, json
          assets=json.loads('{"app.js":[["73e5a65ac9c1be862ff546b3608aa26a6ed6d201","e55510191614cdf999b1ecd9a29240b0604e4232"],"4f5c12337f3b46f17ef093386073a607e0972e85",""],"automation_research.mjs":[["9c43cb8ec585562590844fb83d0c8f20d8172408","fa67d713f4dcc4fbb6a415acb6a1662a90dcfac5"],"c5b9af59236b8eea32630807a18fa7b6e09d5ef2",""],"column-input.js":[[null],"f3f44f2c498e3dbb4dfc06c5e389188f2330c00d",""],"decision-ui.js":[["9039f620f97f5d191cbf3889f665e1beef79b79c","c80c4762c614f7cd15b6de86dcbad718a965e40a"],"e02f722d852f786d778d521038da9e3daba23035",""],"index.html":[["1bc49bf9234747e47adc340861f40a1ede3b315a","e1176f3f26c841bcfad08ee29aa414d48798892f"],"c9a633e5d8b7b8071c6b854a273576e547ba97a9",""],"method-column.html":[["2d862b6d5264adbd525dc994f32ea34f005c728d","d5107bd406ec00a5592661f0a6f439c2e4a34ca5"],"9c921349eed5f7242f067200f37d02d51963da13",""],"multiwindow.js":[["301197442563246ed68b871b7f6fb28568eb3558"],"3e7150426186f157f1b7ccff8ec58e25845342b6",""],"selection-archive.mjs":[["e55175ed310ce064df3b1d8706f124da3951e442","c3465dac93d8c6c7a83c04cd2bd92d8efe695d66"],"c3465dac93d8c6c7a83c04cd2bd92d8efe695d66",""],"selection-engine.js":[["aab7d6e16ffcfa1f0ea3622bb6776526f1c55895","18e2839c2fb8af38ef5eea93e6e9d8eafb140317"],"bf4a1bab195d96dec638a27a432618465ee232d9",""],"selection-ui.js":[["e496131bc324a7c5be973f47e1653602f13d94c0","0f13943dd4f8d8bb18b75898924b16411a039604"],"acbb8f78644c809ca4a13f06c957f7ef3acf52b2",""],"selection.html":[["ab618634610abaa33a6b3167e1309dd1049474bf","4f87e01240090bfc32c42d2bc0b013c826d437a4"],"12dc7382f96a8d0d9b00c2782b004d14114c4803",""],"sw.js":[["8d5914b78a33c7aae5092716f0ee9b8c377a42d8","92fa9edc2a4109169b85163e52186bcdb0476ade"],"703649650264c2d7b3fc3f0cf7b81a536a445aa4",""],"test_formal_research.mjs":[[null,"3fd4765ee7d2fb140d472022109eda8f789d79c8"],"42a38754e8d175ced7f55a8de2215c44ad7747ff",""],"test_method_column.mjs":[["6d0081169476815658119db950ee5bb117e6c1aa"],"1a4d6f995a97461e8665d80153ca49488e78ca4b",""]}')
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+bytes([0])+data).hexdigest()
          updates=[]
          for name,(expected,new,content) in assets.items():
              path=Path(name)
              current=blob(path.read_bytes()) if path.exists() else None
              if current==new:continue
              if current not in expected:raise RuntimeError('File changed since build: '+name)
              raw=gzip.decompress(base64.b64decode(content))
              if blob(raw)!=new:raise RuntimeError('Damaged payload: '+name)
              updates.append((path,raw))
          for path,raw in updates:path.write_bytes(raw)
          print('Installed method column V18.18:',len(updates),'changed files')
          INSTALL
      - name: Run workbench regression tests
        run: |
          node --check trajectory-ui.js
          node --test test_*.mjs
          node --check selection-ui.js
      - name: Commit the tested module
        run: |
          git add app.js automation_research.mjs column-input.js decision-ui.js index.html method-column.html multiwindow.js selection-archive.mjs selection-engine.js selection-ui.js selection.html sw.js test_formal_research.mjs test_method_column.mjs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'release: V18.18 use column pools in public researcher picks'
            git push origin HEAD:main
          fi
      - name: Use existing Pages publishing mode
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = legacy ]; then gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"; fi
      - name: Assemble Pages files
        if: steps.pages.outputs.mode == 'workflow'
        run: |
          mkdir -p "$RUNNER_TEMP/lottery-site"
          for path in *.html *.css *.js *.json *.webmanifest *.svg; do
            if [ -f "$path" ] && [ "$path" != package.json ]; then cp "$path" "$RUNNER_TEMP/lottery-site/"; fi
          done
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.mode == 'workflow'
        with:
          path: ${{ runner.temp }}/lottery-site
  deploy:
    needs: install
    if: needs.install.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publish Pages
        id: pages
        uses: actions/deploy-pages@v4
