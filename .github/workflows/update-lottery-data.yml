        run: |
          git add history.json research.json health.json index.html styles.css app.js sw.js audit-v184.html optimizer-v185.html test_optimizer_v185.mjs
          if git diff --cached --quiet; then
            echo 'Already up to date; no empty commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: V18.5 same-budget optimization and research validation'
