name: Lottery data and public research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-lottery-data.yml'
  schedule:
    - cron: '26 14,15,16,17 * * *'
    - cron: '16 2 * * *'
permissions:
  contents: write
concurrency:
  group: lottery-data-and-research
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate core and V18.3 audit code
        run: |
          node --check core.js
          node --check engine.js
          node --check app.js
          node --check automation_research.mjs
          python -m py_compile sync_history.py apply_v183_integration.py reconcile_official_v183.py
          node --test test_audit_v183.mjs
          python -m unittest -q test_v183_integration test_reconcile_official_v183
          if [ -d tests ] && ls tests/*.test.mjs >/dev/null 2>&1; then node --test tests/*.test.mjs; fi
      - name: Fetch real historical draws
        run: python sync_history.py
      - name: Independently verify via official fallback when available
        run: |
          python reconcile_official_v183.py || echo 'Official fallback unavailable; do not mark as verified'
      - name: Reconcile publicly locked predictions
        run: node automation_research.mjs
      - name: Integrate existing V18.3 audit into home page
        run: |
          python apply_v183_integration.py
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          changes = [
            ('双彩研究工作台 V18.0 · 选号决策中心', '双彩研究工作台 V18.3 · 选号决策与核奖'),
            ('双彩研究工作台 <span>V18.0</span>', '双彩研究工作台 <span>V18.3</span>'),
            ('id="versionInfo">版本 V18.0.0', 'id="versionInfo">版本 V18.3（核心选号引擎延续V18.0）'),
            ('双彩研究工作台 V18.0 · 下一期30期数据决策', '双彩研究工作台 V18.3 · 下一期30期数据决策'),
          ]
          for old, new in changes:
              if old in s:
                  if s.count(old) != 1:
                      raise RuntimeError('Version marker unexpectedly duplicated: ' + old)
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise RuntimeError('Neither old nor upgraded version marker found: ' + old)
          if 'audit-v183.html?v=18.3' not in s:
              raise RuntimeError('V18.3 audit entry missing')
          p.write_text(s, encoding='utf-8')
          print('V18.3 version, audit navigation and styles integrated')
          PY
      - name: Publish updates without overwriting history with packaged files
        run: |
          git add index.html styles.css history.json research.json health.json
          if git diff --cached --quiet; then
            echo 'Already up to date'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: integrate V18.3 UI and reconcile lottery evidence'
          git push
