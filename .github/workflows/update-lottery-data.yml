name: Lottery data and V18.8 selection review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-lottery-data.yml'
  schedule:
    # UTC: daily Beijing 10:16, and around 22:26–01:26
    - cron: '26 14,15,16,17 * * *'
    - cron: '16 2 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: lottery-data-and-research
  cancel-in-progress: false
jobs:
  synchronize:
    outputs:
      pages_mode: ${{ steps.pages.outputs.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout public research repository
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install V18.8 selection review on the existing V18.7 site
        if: hashFiles('selection-archive.mjs') == ''
        run: |
          python - <<'INSTALL'
          from pathlib import Path
          import gzip,base64,hashlib
          payloads = {'selection.html': [None, '4c0abfc87b04f300ea682f6dfcc6ce6ea59935b1b173b6ccbe2624c07ff3afaf', ''], 'selection.css': [None, '7f7a1e1ccb7ef526d894d892845e88f8f2c28e2682d8eb197c5de91ad5ee1b89', ''], 'selection-ui.js': [None, 'c2e2493b8e2cb67b11cd23080e661fe3849261233842f5ddef87541bbcc8175c', ''], 'selection-engine.js': [None, '31b660289a0beae649a3dfede01f7de0930e53b36b8a05b2f30d4ab5bed8d877', ''], 'selection-archive.mjs': [None, 'f806e515912161e455ccad6bd8bd775d839ded78829c1d427ab01ae15b3a170e', ''], 'test_selection.mjs': [None, 'e89b97b66238272b59c428eb11f054f576d801550657ccded47346fb2ef372d9', ''], 'multiwindow.js': ['f2b65424c5d115db986c9ae5b7f27409a29a0cc88ed465fbd4783cb88bec62d0', '936ff5a36ffa4bf18cdfd57bc552658e3f5a91086fe99f7f3df111e0f66f55c6', ''], 'app.js': ['885dec20dff9dedb8686c0a8c7335a85f6984c0059bb32d1678c592054f0c3f0', 'e5e837cde98a1d9a60f2cee0d2afed5b572e4f5661ba227e811011e18c9b5905', ''], 'sw.js': ['cb7b502e5204d64f7aa1b7a744b3092e767d3245899db0379510cfdfecdd732f', '60740d258e606ece8217171e2d00c237f3ae30987198accd00491db44309749a', ''], 'index.html': ['0fe7411a170d6cd2978b15e666e88ffbd05aad951cf3300dc129d625f5f435ba', '7f101b346376e845346250fcd87371f9d647224a5c2d6409aa04abe7c9e655a2', '']}
          writes=[]
          for name,(original,updated,encoded) in payloads.items():
              path=Path(name)
              current=hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              if current==updated:
                  continue
              if current!=original:
                  raise RuntimeError('Repository version changed, refusing to overwrite '+name)
              raw=gzip.decompress(base64.b64decode(encoded))
              if hashlib.sha256(raw).hexdigest()!=updated:
                  raise ValueError('Installer checksum mismatch: '+name)
              writes.append((path,raw))
          for path,raw in writes:
              path.write_bytes(raw)
          print('V18.8 selection review installed:',len(writes),'files')
          INSTALL
      - name: Validate original strategy and 2026 prize-rule tests
        run: |
          node --check core.js
          node --check engine.js
          node --check app.js
          node --check automation_research.mjs
          node --test test_audit_v183.mjs
          python -m unittest -q test_v183_integration test_reconcile_official_v183
          if [ -d tests ] && ls tests/*.test.mjs >/dev/null 2>&1; then node --test tests/*.test.mjs; fi
      - name: Refresh public mirror history (retain old data if upstream unavailable)
        continue-on-error: true
        run: |
          python sync_history.py
      - name: Attempt independent Shanghai official verification
        continue-on-error: true
        run: |
          python reconcile_official_v183.py
      - name: Repair missing 2026-11-12 to 2026-11-15 official results; reject conflicts
        run: |
          python - <<'PY'
          """V18.4 official-evidence recovery; small static 2026-11 bootstrap and live official DLT fallback.
          Run AFTER sync_history.py and optional Shanghai official verification.
          Never overwrite a conflicting existing result.
          """
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import json, re, urllib.request
          
          PATH = Path('history.json')
          OFFICIAL_SSQ = 'https://www.swlc.net.cn/'
          OFFICIAL_SSQ_HISTORY = 'https://appsh.swlc.net.cn/shfcoc_datachart/datachart/ssq/lskj/ls_award.html'
          OFFICIAL_DLT = 'https://www.gstc.org.cn/wanfa/dlt'
          
          # Official site pages were independently checked on Nov 16, 2026. This is a
          # fixed, timestamped safety net, NOT a continuously updated live results feed.
          CONFIRMED = [
              ('ssq','2026133','2026-11-19',[7,10,11,14,21,26],[13],'https://www.swlc.net.cn/lottery/ssq.html?limit=30&view=previous'),
              ('dlt','2026132','2026-11-18',[2,9,16,26,35],[6,11],'https://api.js-lottery.com/cms/post-148272.html'),
              ('ssq','2026130','2026-11-12',[1,2,6,16,20,28],[2],OFFICIAL_SSQ_HISTORY),
              ('ssq','2026131','2026-11-15',[1,10,19,26,31,33],[15],OFFICIAL_SSQ),
              ('dlt','2026130','2026-11-14',[1,7,11,27,29],[2,6],OFFICIAL_DLT),
          ]
          
          class Text(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
              def handle_data(self, s):
                  s = s.strip()
                  if s:self.parts.append(s)
          
          def latest_dlt_from_official():
              """Best effort; reject ambiguous/partial markup instead of guessing."""
              req = urllib.request.Request(OFFICIAL_DLT, headers={
                  'User-Agent':'Mozilla/5.0 (compatible; lottery-integrity-check/18.4)',
                  'Accept':'text/html,application/xhtml+xml'})
              with urllib.request.urlopen(req, timeout=12) as response:
                  if response.status != 200:raise RuntimeError('official DLT HTTP '+str(response.status))
                  raw = response.read(1_500_001)
                  if len(raw)>1_500_000:raise RuntimeError('official DLT page over limit')
                  char = response.headers.get_content_charset() or 'utf-8'
                  html=raw.decode(char, errors='replace')
              p=Text();p.feed(html)
              body=' '.join(p.parts)
              # Anchor to "super lotto / issue / draw date / seven balls" in the official page.
              m = re.search(r'超级大乐透\s*(?:第\s*)?(\d{5}|20\d{5})\s*期\s*开奖日期\s*[：:]\s*(20\d\d-\d\d-\d\d).*?开奖号码\s*[：:]\s*((?:\d{1,2}\s+){6}\d{1,2})',body[:5000])
              if not m:raise ValueError('DLT official markup not recognized')
              issue=m.group(1) if len(m.group(1))==7 else '20'+m.group(1)
              date=m.group(2); nums=[int(v) for v in m.group(3).split()]
              if len(nums)!=7 or len(set(nums[:5]))!=5 or len(set(nums[5:]))!=2 or any(not 1<=v<=35 for v in nums[:5]) or any(not 1<=v<=12 for v in nums[5:]):
                  raise ValueError('DLT official numbers invalid')
              if issue[:4]!=date[:4] or datetime.fromisoformat(date).date()>datetime.now(ZoneInfo('Asia/Shanghai')).date():
                  raise ValueError('DLT official issue/date invalid')
              return ('dlt',issue,date,sorted(nums[:5]),sorted(nums[5:]),OFFICIAL_DLT)
          
          def is_valid(g,issue,date,main,extra):
              if not re.fullmatch(r'20\d{5}',issue):return False
              try:d=datetime.fromisoformat(date).date()
              except ValueError:return False
              if str(d.year)!=issue[:4] or not 1<=int(issue[4:])<=366:return False
              nm,ne,mm,me=(6,1,33,16) if g=='ssq' else (5,2,35,12)
              return len(main)==nm and len(extra)==ne and len(set(main))==nm and len(set(extra))==ne and all(isinstance(n,int) and 1<=n<=mm for n in main) and all(isinstance(n,int) and 1<=n<=me for n in extra)
          
          def apply(path=PATH,live=False, today=None):
              obj=json.loads(path.read_text('utf-8'))
              today=today or datetime.now(ZoneInfo('Asia/Shanghai')).date()
              confirmed=list(CONFIRMED)
              if live:
                  try:
                      z=latest_dlt_from_official(); confirmed.append(z)
                      print('Official Gansu体彩 latest DLT:',z[1],z[2])
                  except Exception as e:
                      print('::warning::Official DLT dynamic fallback unavailable:',str(e)[:160])
              changed=False;additions=[];matches=[]
              for g,issue,date,main,extra,url in confirmed:
                  if datetime.fromisoformat(date).date()>today:continue
                  if not is_valid(g,issue,date,main,extra):raise ValueError('Invalid official snapshot '+g+issue)
                  existing=next((r for r in obj[g] if str(r.get('issue'))==issue),None)
                  if existing:
                      if (existing.get('date'),existing.get('main'),existing.get('extra'))!=(date,main,extra):
                          raise RuntimeError('BLOCKED conflicting official result: '+g+'/'+issue+'; manual review required')
                      # Keep previous verification category. No unfounded upgrade to cross-checked.
                      matches.append(g+'/'+issue)
                  else:
                      obj[g].append({'issue':issue,'date':date,'main':main,'extra':extra,
                                     'verification':'official-only','sources':[url]})
                      additions.append(g+'/'+issue);changed=True
              if changed:
                  for g in ('ssq','dlt'):
                      obj[g].sort(key=lambda row:str(row['issue']),reverse=True)
                      obj.setdefault('provenance',{}).setdefault(g,{})['latestIssue']=obj[g][0]['issue']
                      obj['provenance'][g]['rows']=len(obj[g])
                      obj['provenance'][g]['snapshotRecovery']='官方公告一次性核对快照；不等同于持续独立双源验证'
                  obj['generatedAt']=datetime.now(timezone.utc).isoformat()
                  tmp=path.with_suffix('.tmp')
                  tmp.write_text(json.dumps(obj,ensure_ascii=False,separators=(',',':'))+'\n','utf-8')
                  tmp.replace(path)
              print('V18.4 draw recovery added:',additions,'already matched:',matches)
              return additions
          
          if __name__=='__main__':apply(live=True)
          PY
      - name: Independently reconcile November 16 DLT official draw (reject conflicts)
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('history.json')
          h=json.loads(p.read_text('utf-8'))
          issue='2026131'; day='2026-11-16'
          front=[2,11,18,19,29]; back=[4,7]
          official='重庆市体育彩票管理中心官方第26131期开奖公告 https://www.cqtcw.net/web/aritcle/1572008367349690368/web/content_1572008367349690368.htm'
          matches=[r for r in h.get('dlt',[]) if r['issue']==issue]
          if len(matches)>1:raise RuntimeError('Duplicate official 26131 issue')
          if matches:
              r=matches[0]
              if r['date']!=day or r['main']!=front or r['extra']!=back:
                  raise RuntimeError('Official 26131 conflicts with mirror; quarantine and stop rather than overwrite')
              # This announcement is distinct from the existing third-party mirror.
              sources=r.get('sources',[])
              independent=any('lottery-data' in str(s) or '500.com' in str(s) for s in sources)
              if official not in sources:sources.append(official)
              r['sources']=sources
              r['verification']='cross-checked' if independent else 'official-only'
          else:
              h.setdefault('dlt',[]).append({'issue':issue,'date':day,'main':front,'extra':back,'verification':'official-only','sources':[official]})
          h['dlt'].sort(key=lambda x:str(x['issue']),reverse=True)
          p.write_text(json.dumps(h,ensure_ascii=False,indent=2)+'\n','utf-8')
          print('DLT 26131 verified and preserved; duplicate/conflict protected')
          PY
      - name: Safely recover confirmed Shanghai official SSQ 2026132 without overwriting history
        run: |
          python - <<'PYOFFICIAL'
          from pathlib import Path
          import json
          p=Path('history.json'); h=json.loads(p.read_text('utf-8'))
          official={'issue':'2026132','date':'2026-11-17','main':[5,9,13,17,18,21],'extra':[11],
                    'verification':'official-only','sources':['上海市福利彩票发行中心 www.swlc.net.cn 2026-11-17 第2026132期']}
          rows=h.get('ssq',[])
          existing=[r for r in rows if r.get('issue')=='2026132']
          if existing:
              if len(existing)!=1 or existing[0]['main']!=official['main'] or existing[0]['extra']!=official['extra'] or existing[0]['date']!=official['date']:
                  raise RuntimeError('SSQ 132 historical conflict: reject unsafe overwrite')
              if existing[0].get('verification')!='cross-checked':
                  existing[0]['verification']='cross-checked'
                  existing[0]['sources']=list(dict.fromkeys(existing[0].get('sources',[])+official['sources']))
                  p.write_text(json.dumps(h,ensure_ascii=False,indent=2)+'\n','utf-8')
          else:
              rows.append(official)
              h['ssq']=sorted(rows,key=lambda r:r['issue'],reverse=True)
              p.write_text(json.dumps(h,ensure_ascii=False,indent=2)+'\n','utf-8')
          print('PASS: SSQ 2026132 official recovery, conflict checking enabled')
          PYOFFICIAL
      - name: Settle ONLY truly public pre-draw records and lock new future strategies
        run: |
          node automation_research.mjs
      - name: Create equal-cost random compound controls ONLY for new future records
        run: |
          python - <<'PY'
          """Add unbiased equal-cost compound control ONLY to newly-created future locks."""
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          from zoneinfo import ZoneInfo
          import json,secrets
          
          FILE=Path('research.json')
          
          def apply(path=FILE,now=None):
              now=now or datetime.now(timezone.utc)
              obj=json.loads(path.read_text('utf-8'))
              changed=[];picker=secrets.SystemRandom()
              for r in obj['records']:
                  if r.get('status')!='pending' or r.get('game') not in ('ssq','dlt'):continue
                  try:created=datetime.fromisoformat(r['createdAt'].replace('Z','+00:00'))
                  except (KeyError,ValueError):continue
                  # Never back-fill controls to last week's public records.
                  if not timedelta(0)<=now-created<=timedelta(minutes=30):continue
                  target=datetime.fromisoformat(r['targetDate']).date()
                  if now >= datetime.combine(target, datetime.min.time(), ZoneInfo('Asia/Shanghai'))+timedelta(hours=19):continue
                  if any(p.get('mode')=='random' for p in r.get('compoundPicks',[])):continue
                  g=r['game']
                  main=sorted(picker.sample(range(1,34 if g=='ssq' else 36),8 if g=='ssq' else 7))
                  extra=sorted(picker.sample(range(1,17 if g=='ssq' else 13),1 if g=='ssq' else 2))
                  r.setdefault('compoundPicks',[]).append({
                      'mode':'random','main':main,'extra':extra,
                      'bets':28 if g=='ssq' else 21,'cost':56 if g=='ssq' else 42,
                      'policy':'V18.4 prospective equal-cost random compound baseline',
                      'createdAt':now.isoformat()})
                  changed.append(g+'/'+r['targetDate'])
              if changed:
                  obj['generatedAt']=now.isoformat()
                  path.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n','utf-8')
              print('V18.4 new (non-retrospective) compound controls:',changed)
              return changed
          
          if __name__=='__main__':apply()
          PY

      - name: Archive future selections and update paired comparisons
        run: |
          node --check selection-ui.js
          node v187-public-lock.mjs
          node selection-archive.mjs
          node --test test_*.mjs
      - name: Publish verified data and research records
        run: |
          git add selection.html selection.css selection-ui.js selection-engine.js selection-archive.mjs test_selection.mjs multiwindow.js app.js sw.js index.html history.json research.json health.json selection-data.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: update draws, settlements and pre-draw selection records'
          git push

      - name: Read existing Pages publishing mode
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Request a build of the published branch
        if: steps.pages.outputs.mode == 'legacy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Prepare the static Pages files
        if: steps.pages.outputs.mode == 'workflow'
        run: |
          mkdir -p "$RUNNER_TEMP/lottery-site"
          for path in *.html *.css *.js *.json *.webmanifest *.svg; do
            if [ "$path" != 'package.json' ]; then cp "$path" "$RUNNER_TEMP/lottery-site/"; fi
          done
      - name: Upload the Pages site
        if: steps.pages.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/lottery-site
  deploy-pages:
    needs: synchronize
    if: needs.synchronize.outputs.pages_mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
