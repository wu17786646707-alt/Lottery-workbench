name: Lottery data and public research
on:
  workflow_dispatch:
  schedule:
    # Beijing 22:26, 23:26, 00:26, 01:26, 10:16. UTC offsets, GitHub schedule may be delayed.
    - cron: '26 14,15,16,17 * * *'
    - cron: '16 2 * * *'
permissions:
  contents: write
concurrency:
  group: lottery-data-and-research
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate existing source code
        run: |
          node --check core.js
          node --check engine.js
          node --check app.js
          node --check automation_research.mjs
          if [ -d tests ] && ls tests/*.test.mjs >/dev/null 2>&1; then node --test tests/*.test.mjs; else echo "No repository test suite installed; syntax checks still run"; fi
          python -m py_compile sync_history.py
          node --input-type=module -e "import fs from 'node:fs'; import {pick} from './engine.js'; const h=JSON.parse(fs.readFileSync('history.json','utf8')); for(const g of ['ssq','dlt']) { if(h[g].length<30) throw Error(g+' too few draws'); const p=pick(h[g],g,'analyst',{window:60}); if(!p.main.length) throw Error('empty strategy'); }"
      - name: Fetch and independently compare draw results (best effort)
        run: python sync_history.py
      - name: Write public pre-draw A/B/C snapshots and reconcile older locks
        run: node automation_research.mjs
      - name: Commit changed public data and transparent health alerts
        run: |
          git add history.json research.json health.json
          if git diff --cached --quiet; then
            echo 'No updates to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: refresh history, public research and health status'
          git push
