          if 'optimizer-v185.html?v=18.5' not in html:
              if html.count('</nav>')!=1:raise RuntimeError('Unexpected nav structure')
              html=html.replace('</nav>',link+'</nav>',1)
          html=html.replace('app.js?v=18.4','app.js?v=18.5').replace('styles.css?v=18.4','styles.css?v=18.5')
          if '<span>V18.5</span>' not in html or html.count('optimizer-v185.html?v=18.5')!=1:
              raise RuntimeError('V18.5 not integrated')
          homepath.write_text(html,'utf-8')
          
          css=ROOT/'styles.css'
          styles=css.read_text('utf-8')
          marker='/* V18.5 optimizer entry */'
          if marker not in styles:
              styles+='\n'+marker+'\n.nav a.v185-nav{display:inline-flex;align-items:center;white-space:nowrap;padding:9px 12px;border:1px solid #33a99b;border-radius:8px;background:#15544f;color:#e2fff8;font-weight:700;text-decoration:none;font-size:12px}\n'
          css.write_text(styles,'utf-8')
          app=ROOT/'app.js'
          code=app.read_text('utf-8')
          if '界面 V18.4 / 选号核心' in code: code=code.replace('界面 V18.4 / 选号核心','界面 V18.5 / 选号核心',1)
          if '界面 V18.5 / 选号核心' not in code:raise RuntimeError('V18.5 dynamic footer not found')
          app.write_text(code,'utf-8')
          
          sw=ROOT/'sw.js'
          pwa=sw.read_text('utf-8')
          if "'./optimizer-v185.html?v=18.5'" not in pwa:
              if "'./audit-v184.html?v=18.4'," not in pwa:raise RuntimeError('V18.4 precache anchor missing')
