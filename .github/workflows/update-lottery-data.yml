          pwa=pwa.replace('dual-lottery-v18.4-evidence','dual-lottery-v18.5-evidence')
          pwa=pwa.replace("'./app.js?v=18.4'","'./app.js?v=18.5'").replace("'./styles.css?v=18.4'","'./styles.css?v=18.5'")
          if 'dual-lottery-v18.5' not in pwa:raise RuntimeError('V18.5 cache version not set')
          sw.write_text(pwa,'utf-8')
