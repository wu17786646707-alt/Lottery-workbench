name: Install method column V18.16
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/install-method-column-v1816.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: lottery-data-and-research
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pages.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install selection column and rear-number audit
        run: |
          python - <<'INSTALL'
          from pathlib import Path
          import base64, gzip, hashlib, json
          assets=json.loads('{"index.html":[["6edec669f14c46c7388dbff8643b91bbfce2d9a5","cb589aa0902fcbc93dcea30fdd96f83216927435","909a50017895b4993e7a47ad38a23678ac41e155","5863056e5719de554481f1ed625dcc1c9f36118c","b937cf407b9ced0a7323e22a0a8effe47bfe5669","dfbbc550c1dee0fc55442ead5cfc797bbce6e476"],"1bc49bf9234747e47adc340861f40a1ede3b315a",""],"app.js":[["32c5254ee455bd051beb564903c5e22894539cd2","994e2b45762e84c74fc73ec2533a7a1151aaec98","13f7353dfbe252a4bfe304e27e7b9ed728de63b8","bfb8aec562b57fbd20e684c94b52361ede374023","173a04e4f7a3d4d339941096f9b9690476660983","6f666b4244b5db48478977f7354aedee6f610c3a"],"73e5a65ac9c1be862ff546b3608aa26a6ed6d201",""],"selection.html":[["013547e25d1022598c2841345e5da42c9d6a80af","2f25c214baf235db78e8336e18fcc55b28f77507","ae6d5627799b4e802d4954ffb2291a28e470ef1c","10ced0129c03207f64d7da2c636abdd6361e98f2","dd7bec19164bfd1d56966fae8a278a38e3ca6e78","71633542e5cd43b768d23d2282ca6c3ffc8e5c0f"],"ab618634610abaa33a6b3167e1309dd1049474bf",""],"selection-ui.js":[["6d9ec564fbacc82e1812144748a460361ee27f24","e496131bc324a7c5be973f47e1653602f13d94c0"],"e496131bc324a7c5be973f47e1653602f13d94c0",""],"sw.js":[["5c011b9764ee5dbc28eb8e82bff6308fce9d5f18","1fb1d2df952c3f9d100f079e7563ecd5b48d233f","2e403d2c82466ba9ffc1b7913c6c7c6e80eeb6e6","bde03cd4198b81bc38924d5d90e7de455063d492","481313aeec7328cf96df79d86ff94ad590321d23","d8d8592cf9ac1e2f046d28cc9706d3650ed8c72b"],"8d5914b78a33c7aae5092716f0ee9b8c377a42d8",""],"stage-audit.js":[[null,"0a6ade745c56cda8d09abef874ce6540ef6a52f9"],"0a6ade745c56cda8d09abef874ce6540ef6a52f9",""],"method-column.html":[[null,"b311c4e8a3dc48cd4cdf624b49285f0fb0166976","34676076eb0049844644d65acd3ea3eaa9e18236","325f49d319fbb402cc1c389ac6b2f129481b3d23","9c7cdfeb6bf4c96f7cbcb211678bcdee23a2c33f"],"2d862b6d5264adbd525dc994f32ea34f005c728d",""],"test_method_column.mjs":[[null,"2492671655b47d39cb4cea9fb52a61470780bbab"],"6d0081169476815658119db950ee5bb117e6c1aa",""]}')
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+bytes([0])+data).hexdigest()
          updates=[]
          for name,(expected,new,content) in assets.items():
              path=Path(name)
              current=blob(path.read_bytes()) if path.exists() else None
              if current==new:continue
              if current not in expected:raise RuntimeError('File changed since build: '+name)
              raw=gzip.decompress(base64.b64decode(content))
              if blob(raw)!=new:raise RuntimeError('Damaged payload: '+name)
              updates.append((path,raw))
          for path,raw in updates:path.write_bytes(raw)
          print('Installed method column V18.16:',len(updates),'changed files')
          INSTALL
      - name: Run workbench regression tests
        run: |
          node --check trajectory-ui.js
          node --test test_*.mjs
          node --check selection-ui.js
      - name: Commit the tested module
        run: |
          git add test_method_column.mjs index.html app.js selection.html selection-ui.js sw.js stage-audit.js method-column.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'release: V18.16 analyst column for both games'
            git push origin HEAD:main
          fi
      - name: Use existing Pages publishing mode
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = legacy ]; then gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"; fi
      - name: Assemble Pages files
        if: steps.pages.outputs.mode == 'workflow'
        run: |
          mkdir -p "$RUNNER_TEMP/lottery-site"
          for path in *.html *.css *.js *.json *.webmanifest *.svg; do
            if [ -f "$path" ] && [ "$path" != package.json ]; then cp "$path" "$RUNNER_TEMP/lottery-site/"; fi
          done
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.mode == 'workflow'
        with:
          path: ${{ runner.temp }}/lottery-site
  deploy:
    needs: install
    if: needs.install.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publish Pages
        id: pages
        uses: actions/deploy-pages@v4
