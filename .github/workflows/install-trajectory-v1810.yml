name: Install trajectory study V18.10
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/install-trajectory-v1810.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: lottery-data-and-research
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pages.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install trajectory module in the current workbench
        run: |
          python - <<'INSTALL'
          from pathlib import Path
          import base64, gzip, hashlib, json
          assets=json.loads('{"app.js":["2046460742df869f37363e17d73e50e5c81290c1","32c5254ee455bd051beb564903c5e22894539cd2",""],"index.html":["6367ea776758ff12026f1277993b8ceba3a450a4","6edec669f14c46c7388dbff8643b91bbfce2d9a5",""],"selection-archive.mjs":["f6bc9492d1c47b9b53d64689e176bcee43fc4861","e55175ed310ce064df3b1d8706f124da3951e442",""],"selection.html":["ba8b3fe4a9cff1e6b8cba97f15199b1f9c14de81","013547e25d1022598c2841345e5da42c9d6a80af",""],"sw.js":["a341bf0019a3ac4fabd6b8834d34cbf0bb3cb41d","5c011b9764ee5dbc28eb8e82bff6308fce9d5f18",""],"trajectory.html":[null,"2ec84675ec1c26bd0443060d063a858aad7c08b1",""],"trajectory.js":[null,"d7a4bc528c0d440771a93c7e4c8c6065a58b1fb4",""],"trajectory-ui.js":[null,"0c9b44cfa92155482e1efa7f2e03daadcf4b5b42",""],"trajectory.css":[null,"8f74da57f624e7edd76dff89e7e7c8e887280152",""],"test_trajectory.mjs":[null,"4d31cff0b1ac1eae195b9b52da18934d7e65b254",""]}')
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+bytes([0])+data).hexdigest()
          updates=[]
          for name,(expected,new,content) in assets.items():
              path=Path(name)
              current=blob(path.read_bytes()) if path.exists() else None
              if current==new:continue
              if current!=expected:raise RuntimeError('File changed since build: '+name)
              raw=gzip.decompress(base64.b64decode(content))
              if blob(raw)!=new:raise RuntimeError('Damaged payload: '+name)
              updates.append((path,raw))
          for path,raw in updates:path.write_bytes(raw)
          print('Installed trajectory V1:',len(updates),'changed files')
          INSTALL
      - name: Check and archive current eligible pre-draw targets
        run: |
          node --check trajectory-ui.js
          node --test test_*.mjs
          node selection-archive.mjs
      - name: Commit the tested module
        run: |
          git add app.js index.html selection-archive.mjs selection.html sw.js trajectory.html trajectory.js trajectory-ui.js trajectory.css test_trajectory.mjs selection-data.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'release: V18.10 trajectory selection and walk-forward backtest'
            git push origin HEAD:main
          fi
      - name: Use existing Pages publishing mode
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = legacy ]; then gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"; fi
      - name: Assemble Pages files
        if: steps.pages.outputs.mode == 'workflow'
        run: |
          mkdir -p "$RUNNER_TEMP/lottery-site"
          for path in *.html *.css *.js *.json *.webmanifest *.svg; do
            if [ "$path" != package.json ]; then cp "$path" "$RUNNER_TEMP/lottery-site/"; fi
          done
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.mode == 'workflow'
        with:
          path: ${{ runner.temp }}/lottery-site
  deploy:
    needs: install
    if: needs.install.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publish Pages
        id: pages
        uses: actions/deploy-pages@v4
