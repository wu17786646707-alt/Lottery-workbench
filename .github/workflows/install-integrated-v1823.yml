          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+bytes([0])+data).hexdigest()
          updates=[]
          for name,(expected,new,content) in assets.items():
              path=Path(name)
              current=blob(path.read_bytes()) if path.exists() else None
              if current==new:continue
              if current not in expected:raise RuntimeError('File changed since build: '+name)
              raw=gzip.decompress(base64.b64decode(content))
              if blob(raw)!=new:raise RuntimeError('Damaged payload: '+name)
              updates.append((path,raw))
          for path,raw in updates:path.write_bytes(raw)
