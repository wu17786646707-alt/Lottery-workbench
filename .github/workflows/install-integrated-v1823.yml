          node --test test_*.mjs
          node --check selection-ui.js
      - name: Commit the tested module
        run: |
          node automation_research.mjs
          node selection-archive.mjs
          git add research.json selection-data.json health.json app.js automation_research.mjs core.js decision-engine.js decision-ui.js index.html issue-context.js method-column.html multiwindow-ui.js replay-stages.js selection-archive.mjs selection-engine.js selection-ui.js selection.html shape-ui.js stage-report-ui.js stage-report-view.js stage-report.html sw.js test_formal_research.mjs test_stage_replay.mjs unified-rule.js
